<div class="post-card">
  <div class="post-header">
    <h3 class="post-title">{{ post.title }}</h3>
  </div>

  <div class="post-body">
    <p class="post-text">{{ (post.text || '').substring(0, 150) }}{{ (post.text || '').length > 150 ? '...' : '' }}</p>
  </div>

  <div class="post-footer">
    <div class="post-image" *ngIf="post.imgSrc">
      <img [src]="post.imgSrc" [alt]="post.title" class="thumbnail" />
    </div>
    <div class="post-actions">
      <button type="button" class="btn-edit" (click)="editPost(post)" title="Edytuj post">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>
      <button type="button" class="btn-delete" (click)="deletePost(post)" title="Usuń post">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </div>
  </div>
</div>
