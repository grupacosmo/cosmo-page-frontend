<div class="dialog-wrapper">
  <div class="dialog-header">
    <h2>Edytuj post</h2>
    <button type="button" class="close-btn" (click)="onNoClick()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <mat-dialog-content class="dialog-body">
    <form [formGroup]="editPostForm" (ngSubmit)="onEdit()">
      <!-- Title -->
      <div class="form-field">
        <label>Tytuł *</label>
        <input type="text" formControlName="title" placeholder="Wpisz tytuł" required/>
      </div>

      <!-- Text -->
      <div class="form-field">
        <label>Tekst posta *</label>
        <textarea formControlName="text" placeholder="Wpisz zawartość posta" rows="12"></textarea>
      </div>

      <!-- File Upload -->
      <div class="form-field">
        <label>Załączniki</label>
        <input #attachments type="file" accept="image/*" multiple (change)="showPreview($event)"/>
      </div>

      <!-- Image Previews -->
      <div class="image-preview-grid" *ngIf="previews.length > 0">
        <div class="preview-item" *ngFor="let preview of previews; trackBy: trackByFn">
          <img [src]="preview.preview" [alt]="preview.file.name"/>
          <button type="button" class="remove-btn" (click)="onDelete(preview.file.name)" title="Usuń">×</button>
          <span class="file-name">{{ preview.file.name | slice:0:15 }}</span>
        </div>
      </div>
    </form>
  </mat-dialog-content>

  <div class="dialog-actions">
    <button type="button" class="btn-cancel" (click)="onNoClick()">Anuluj</button>
    <button type="button" class="btn-submit" (click)="onEdit()" [disabled]="editPostForm.invalid">Edytuj post</button>
  </div>
</div>
